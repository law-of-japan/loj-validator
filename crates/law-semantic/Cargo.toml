[package]
name = "law-semantic"
description = "Semantic AST, Markdown mapping and relational validation for Japanese law Markdown"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde_json = { workspace = true }
jsonschema = { workspace = true }
sha2 = { workspace = true }
pulldown-cmark = { workspace = true }
regex = { workspace = true }
yaml-rust2 = { version = "=0.10.4", default-features = false }
same-file = "=1.0.6"

[dev-dependencies]
# Property tests only. Pinned like the other inputs of a test run; without the
# fork and timeout features, which need extra crates and child processes.
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

[lints]
workspace = true

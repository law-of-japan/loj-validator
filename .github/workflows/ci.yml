name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: [stable]
        include:
          - os: ubuntu-latest
            toolchain: '1.88.0'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        run: cargo fmt --all --check
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      # The conformance suites also run in the Test step above; these steps run them
      # again only to write the per-case reports, which are uploaded below.
      - name: Formal v1alpha1 conformance (pinned vendored specification)
        shell: bash
        env:
          LOJ_CONFORMANCE_REPORT: ${{ github.workspace }}/conformance-reports/v1alpha1-conformance.json
        run: |
          mkdir -p conformance-reports
          cargo test -p law-semantic --test v1alpha1_conformance --locked -- --nocapture
      - name: Formal next-spec conformance (pinned vendored specification)
        env:
          LOJ_CONFORMANCE_REPORT_DIR: ${{ github.workspace }}/conformance-reports
        run: cargo test -p law-semantic --test next_conformance --locked -- --nocapture
      - name: Upload conformance reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-reports-${{ matrix.os }}-${{ matrix.toolchain }}
          path: conformance-reports/
          if-no-files-found: warn
      - name: Clippy
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

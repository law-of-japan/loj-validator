[workspace]
members = ["crates/law-semantic", "crates/loj-validator"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"

[workspace.dependencies]
law-semantic = { path = "crates/law-semantic" }
# Structure validator: pin the upstream published crate for reproducible validation behavior.
schematter-lib = "=0.2.0"
serde_json = "1"
jsonschema = { version = "0.47", default-features = false }
sha2 = "0.10"
pulldown-cmark = "=0.13.4"
regex = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

# Named one by one, so that a new toolchain does not add lints by itself.
# CI turns warnings into errors.
[workspace.lints.clippy]
# The public API must not panic on invalid input: no unwrap outside tests.
# What remains is an `expect` that states the invariant.
unwrap_used = "warn"
# Positions are byte offsets; a cast must not shorten or re-sign one silently.
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
# A result that is dropped is a check that was not looked at, and an `Err`
# needs to say whether it is about the input or about the environment.
must_use_candidate = "warn"
missing_errors_doc = "warn"

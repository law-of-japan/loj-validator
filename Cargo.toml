[workspace]
members = ["crates/law-semantic", "crates/loj-validator"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"

[workspace.dependencies]
law-semantic = { path = "crates/law-semantic" }
# Structure validator: upstream published crate, exact version (docs/decisions.md).
schematter-lib = "=0.2.0"
serde_json = "1"
jsonschema = { version = "0.47", default-features = false }
sha2 = "0.10"
pulldown-cmark = "=0.13.4"
regex = "1"
